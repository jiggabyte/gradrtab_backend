# Render Blueprint: GradrTab API (Docker) + Managed Postgres
# Deploy: push to GitHub -> Render dashboard -> New -> Blueprint -> select repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gradrtab-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render injects PORT automatically; app binds Kestrel to it.
      - key: DATABASE_URL
        fromDatabase:
          name: gradrtab-db
          property: connectionString
      - key: JwtSettings__Secret
        sync: false # set in dashboard -> keep secret out of git
      - key: JwtSettings__Issuer
        value: GradrTab
      - key: JwtSettings__Audience
        value: GradrTabUsers
      - key: JwtSettings__DurationInMinutes
        value: "60"
      - key: DB_SSLMODE
        value: Require
    disk:
      name: gradrtab-uploads
      mountPath: /app/Storage
      sizeGB: 1

databases:
  - name: gradrtab-db
    plan: starter
    databaseName: gradrtab_db
    user: gradrtab
